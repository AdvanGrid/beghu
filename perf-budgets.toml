# The perf gates' limits: owner-reviewed (CODEOWNERS), with no override label. Every gate a suite
# measures needs a section here, with the value it was calibrated from and a reason.
#
# Calibrated from the first build that has every gate (spec #86, "Perf gates on every PR"):
# timings +15% over the measured median of 10, bytes +5% (and never past the 14 KB a response
# or push may weigh), counts exactly. This first calibration ran on the dev host (32 cores, at
# load 50 to 110 from other work), not on CI's runner: recalibrate the timings from the first
# CI run's perf-* artifacts before relying on them, and review the counts flagged "for the
# owner" in their reasons. Timings are CI's to hold (ubuntu-latest, loopback,
# unthrottled, the 50k fixture); `./dev-ctl perf` compares timings with local main instead.
# To recalibrate from a run's results (CI's perf-* artifacts, or .dev/perf/*.json):
#   node perf/harness/src/main.ts calibrate perf-results/*.json
# then review the diff and each reason. A limit moves only when a slower result is accepted on
# purpose, never to get a PR through.

[meta]
scale = "50k"

# ./dev-ctl perf: a timing fails when this tree's median is more than `slower_than` slower than
# local main's and slower by more than `floor_ms`. floor_ms is loopback noise: a sub-10 ms
# answer moves by more than 10% (well over 0.5 ms) between two runs on an idle machine, and a
# 1 ms floor keeps those from failing while a real 10% on anything over 10 ms still does.
[local]
slower_than = 0.10
floor_ms = 1.0

