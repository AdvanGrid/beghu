[package]
name = "bench-filtering-sqlx"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
# sqlx 0.9 takes libsqlite3-sys <0.38, so rusqlite stays on 0.39 (libsqlite3-sys 0.37) to share one
# SQLite build with it. Both layers then run the same SQLite with the same LIBSQLITE3_FLAGS.
rusqlite = { version = "0.39", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.34"
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "macros", "migrate", "runtime-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.7", features = ["fs", "compression-gzip"] }
ts-rs = "12"
flate2 = "1"
brotli = "8"
bytes = "1"
axum-extra = { version = "0.12.6", features = ["query"] }

[profile.release]
lto = "thin"
