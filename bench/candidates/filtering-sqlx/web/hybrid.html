<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>beghu bench: filtering (hybrid)</title>
    <!-- The first page comes from the server, as in the server variant; the worker cache warms after it. The URLs must match api.ts exactly. -->
    <link rel="preload" href="/api/facets" as="fetch" crossorigin />
    <link rel="preload" href="/api/issues?state=open&offset=0&limit=100" as="fetch" crossorigin />
    <script>
      document.documentElement.classList.toggle('dark', matchMedia('(prefers-color-scheme: dark)').matches);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-hybrid.tsx"></script>
  </body>
</html>
