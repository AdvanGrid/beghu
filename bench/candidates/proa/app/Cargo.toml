[package]
name = "bench-proa"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.7.9"
axum-extra = { version = "0.9", features = ["query"] }
futures-util = "0.3"
proa_core = "0.3.0"
proa_framework_axum = "0.3.0"
proa_macros = "0.3.0"
r2d2 = "0.8"
r2d2_sqlite = "0.25"
rsjs = "0.2.0"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs", "compression-br", "compression-gzip"] }

[profile.release]
lto = "thin"
