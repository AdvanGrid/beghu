[package]
name = "proa-probe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.7.9"
proa_core = "0.3.0"
proa_framework_axum = "0.3.0"
proa_macros = "0.3.0"
rsjs = "0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
