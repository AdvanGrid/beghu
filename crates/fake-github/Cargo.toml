[package]
name = "fake-github"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Fake GitHub: GitHub's API, OAuth and webhooks for local dev and tests, over its own copy of the fixture, with faults set at runtime on a control port."

[dependencies]
axum = { workspace = true }
base64 = "0.22"
dbrt = { workspace = true }
futures-util = { version = "0.3", default-features = false }
# The selection set of a GraphQL query, to answer only the fields it asks for (`select.rs`).
graphql-parser = "0.4"
fake-db = { workspace = true }
hmac = "0.12"
mirror-db = { workspace = true }
# The images the fake serves: attachments and its stand-in for the web's image hosts.
png = "0.18"
rand = "0.9"
reqwest = { workspace = true }
# RS256, to check the App's JWTs: already in the build through rustls.
ring = "0.17"
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = "0.7"
sha2 = "0.10"
tokio = { workspace = true, features = ["net", "signal"] }

[dev-dependencies]
fixture = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
