[package]
name = "beghu"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "The beghu server: one binary for the HTTP API, webhooks and every job."

[dependencies]
aes-gcm = "0.10"
axum = { workspace = true }
base64 = "0.22"
control-db = { workspace = true }
dbrt = { workspace = true }
futures-util = { version = "0.3", default-features = false }
# The rendered-Markdown cache's LRU order: already in the build through rusqlite.
hashlink = "0.12"
hkdf = "0.12"
hmac = "0.12"
# Image sizes from the first bytes of a file, for the probes (`media/probe.rs`).
imagesize = "0.15"
md-ast = { path = "../md-ast" }
mirror-db = { workspace = true }
rand = "0.9"
# `stream`: the attachment route and the image proxy stream bytes through.
reqwest = { workspace = true, features = ["rustls-tls", "stream"] }
# RS256 for the App's JWTs: already in the build through rustls.
ring = "0.17"
rusqlite = { workspace = true }
serde = { workspace = true }
# `raw_value`: a cached post goes out as the JSON it was stored as.
serde_json = { workspace = true, features = ["raw_value"] }
serde_urlencoded = "0.7"
sha2 = "0.10"
tokio = { workspace = true, features = ["net", "signal"] }
# The drain's hook for background jobs (`jobs.rs`).
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "fs"] }
ts-rs = "12"
# URL hosts as the image proxy's guard reads them: already in the build through reqwest.
url = "2"

# `statfs` on the data directory, to refuse a network filesystem (`volume.rs`).
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
# Decode what the server compressed.
brotli = "8"
bytes = "1"
fake-github = { path = "../fake-github" }
# GitHub-side facts of a fixture issue (its node id) that no HTTP seam shows.
fake-db = { workspace = true }
fixture = { workspace = true }
flate2 = "1"
reqwest = { workspace = true, features = ["stream"] }
# Tests that need control-DB state no HTTP seam can make (tampering, a lock another process
# holds, an aged session, a preference no API sets yet) open the control DB themselves. Never
# a mirror: mirror state comes from Fake GitHub or the fixture (AGENTS.md).
rusqlite = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
