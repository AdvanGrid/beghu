[package]
name = "analysis"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "The PR view's analysis: its types (the schema), the validator, the migrations, the split check and the merge. No I/O."

# No I/O and no SQL: the server, the beghu CLI, the WASM build (validate.mjs, merge.mjs), CI and
# the tiler all call this crate, and file contents reach it only through a `Reader` the caller
# supplies.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# The JSON pointer to the exact field serde refused (`/nodes/1/files/0/added`), for the report.
# Already in the tree through axum.
serde_path_to_error = "0.1"
# `no-serde-warnings`: ts-rs ignores the serde attributes it has no TypeScript for
# (`deny_unknown_fields` on an enum, `deserialize_with`) and would print a warning for each.
ts-rs = { version = "12", features = ["no-serde-warnings"] }

[dev-dependencies]
# The schema guard hashes the generated schema.ts (`tests/schema.rs`).
sha2 = "0.10"

[lints]
workspace = true
