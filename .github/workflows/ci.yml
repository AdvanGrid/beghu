name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default; no job here needs more.
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      # The build runs the SQL checker over every migration and named query.
      - name: Build
        run: cargo build --workspace --all-targets --locked

      # -D on the command line also covers a crate that forgets `[lints] workspace = true`.
      - name: Lint (SQL only in the database crates)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -D clippy::disallowed_methods

      - name: Test
        run: cargo test --workspace --exclude fixture --locked

      # ts-rs writes the server's wire types to web/src/bindings during `cargo test`.
      - name: TypeScript bindings are committed
        run: |
          git add -N web/src/bindings
          git diff --exit-code -- web/src/bindings || {
            echo "web/src/bindings is stale: run cargo test and commit it"; exit 1; }

      - name: Fixture still loads after the migrations
        run: cargo test -p fixture --locked

  secrets:
    # gitleaks over the whole history: its default rules, with .gitleaks.toml allowing the dev and
    # test keys committed on purpose. The official image rather than gitleaks-action, which wants
    # a paid licence for an organisation's repos.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan for secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.24.0@sha256:2bcceac45179b3a91bff11a824d0fb952585b429e54fc928728b1d4d5c3e5176 \
            git --config .gitleaks.toml --redact --no-banner --verbose .

  zizmor:
    # The workflows' own audit (zizmor's regular persona): unpinned actions, template injection,
    # persisted credentials, broad permissions and the rest. Fails at medium and above. Its
    # online audits (known-vulnerable action versions, impostor commits) read GitHub with the
    # job's read-only token.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          min-severity: medium
          # The findings go to the log, not code scanning (which would need security-events).
          advanced-security: false

  cargo-deny:
    # deny.toml: RustSec advisories, the licence allowlist, crates.io as the only source, bans.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2

      - name: Check
        run: cargo deny --locked check

      # A path dependency is only ever a workspace crate: nothing from outside this checkout.
      - name: No path dependencies outside the workspace
        run: |
          outside=$(cargo metadata --format-version 1 --locked |
            jq -r --arg root "$PWD/" '.packages[] | select(.source == null) | .manifest_path
              | select(startswith($root) | not)')
          [ -z "$outside" ] || { echo "path dependencies outside the workspace:"; echo "$outside"; exit 1; }

  cargo-vet:
    # supply-chain/: every crate and version in Cargo.lock is audited (ours or an imported audit
    # set) or exempted, and either shows in the diff. --locked: the imports come from
    # supply-chain/imports.lock, never fetched afresh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-vet@0.10.3

      - name: Check
        run: cargo vet --locked

  dev-ctl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/dev-ctl/package-lock.json

      # No package runs an install script; then the registry's signatures and provenance.
      - name: Install
        run: |
          npm ci --ignore-scripts
          npm audit signatures
        working-directory: tools/dev-ctl

      - name: Typecheck ./dev-ctl
        run: npx tsc --noEmit
        working-directory: tools/dev-ctl

  perf-harness:
    # The perf harness's own checks; the gates themselves run in perf.yml.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: perf/harness
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: perf/harness/package-lock.json

      - name: Install
        run: |
          npm ci --ignore-scripts
          npm audit signatures

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: |
          npm ci --ignore-scripts
          npm audit signatures

      - name: Typecheck
        run: npx tsc --noEmit

      # StyleX's rules, colours only from the token module, no class/style attributes and no CSS
      # import but the escape stylesheet; then the lint rules' own tests.
      - name: Lint
        run: |
          npx eslint .
          npm run test:lint

      - name: Build
        run: npx vite build

  changes:
    # Whether a PR touches what the image is built from: the server's and the web app's sources
    # as much as the Dockerfile, so most PRs do. `image` runs only then (and on main).
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            image:
              - Dockerfile
              - .dockerignore
              - deploy/**
              - Cargo.toml
              - Cargo.lock
              - .cargo/**
              - crates/**
              - perf/fixture/**
              - web/src/**
              - web/package.json
              - web/package-lock.json
              - web/vite.config.*
              - web/index.html
              - web/theme.js
              - web/*.svg
              - .github/workflows/ci.yml

  image:
    # The deploy image (docs/deploy.md): built from the Dockerfile, then run as it would be
    # deployed, on a fresh volume, by deploy/smoke.sh. Nothing is pushed. On main, and on PRs
    # that touch the image's inputs; required where it runs (a skipped job passes).
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The layers cached in GitHub Actions' cache between runs.
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: beghu:ci
          build-args: BEGHU_BUILD_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: deploy/smoke.sh beghu:ci

  e2e:
    # Playwright on full Chromium (new headless mode) against the ./dev-ctl stack in fixture mode.
    # The stale-page specs (back-forward, accounts, deploy) turn the back-forward cache on
    # (web/e2e/bfcache.ts); deploy.spec.ts builds the web app twice through ./dev-ctl deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tools/dev-ctl/package-lock.json

      - name: Install
        run: |
          npm --prefix web ci --ignore-scripts
          npm --prefix tools/dev-ctl ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Start the stack
        run: ./dev-ctl start --scale 1k

      - name: Browser tests
        run: npx playwright test
        working-directory: web

      - name: Stack log
        if: failure()
        run: ./dev-ctl logs -n 300

      - name: Stop the stack
        if: always()
        run: ./dev-ctl stop

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
