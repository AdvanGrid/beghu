[workspace]
resolver = "3"
members = [
  "crates/sqlcheck",
  "crates/dbrt",
  "crates/mirror-db",
  "crates/control-db",
  "crates/fake-db",
  "crates/fake-github",
  "crates/server",
  "perf/fixture",
]
# The benchmark candidates are throwaway projects with their own manifests.
exclude = ["bench"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
# `bundled` builds SQLite from source with FTS5. `.cargo/config.toml` sets the extra compile
# flags (LIBSQLITE3_FLAGS) for both the app and the build-time checker.
rusqlite = { version = "0.40", features = ["bundled", "column_metadata", "column_decltype", "modern_sqlite"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
tempfile = "3"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tests talk to the servers over plain HTTP on loopback; no TLS.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
sqlcheck = { path = "crates/sqlcheck" }
dbrt = { path = "crates/dbrt" }
mirror-db = { path = "crates/mirror-db" }
control-db = { path = "crates/control-db" }
fake-db = { path = "crates/fake-db" }
fixture = { path = "perf/fixture" }

# SQLite's C at -O0 makes debug tests and fixture generation several times slower.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[workspace.lints.clippy]
# SQL lives only in the database crates (sqlcheck, dbrt, mirror-db, control-db, fake-db).
# Everywhere else calls the functions they generate. Those crates opt out with
# `#![allow(clippy::disallowed_methods)]`.
disallowed_methods = "deny"
